<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Feeling - Clasicos A Puro Sentimiento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #b30000;
        }
        h1 {
            font-size: 1.8rem;
            color: #ff4d4d;
            letter-spacing: 2px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-grow: 1;
        }
        .player-card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            text-align: center;
        }
        .status-text {
            margin: 15px 0;
            font-size: 1.1rem;
            color: #ffb3b3;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            background-color: #b30000;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e60000;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        footer {
            background-color: #1a1a1a;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>FM FEELING</h1>
        <p>Clásicos A Puro Sentimiento</p>
    </header>

    <div class="main-container">
        <div class="player-card">
            <h2>EN VIVO AL AIRE</h2>
            <div id="track-info" class="status-text">Cargando transmisión...</div>
            
            <audio id="audio-player" controls></audio>

            <div class="controls">
                <button id="play-btn">▶ Reproducir Radio</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FM Feeling. Transmitiendo los mejores clásicos.</p>
    </footer>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const trackInfo = document.getElementById('track-info');

        // Lista directa y segura de tus temas en Supabase
        const playlistOriginal = [
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/01.%20Hotel%20California.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/01.%20She's%20A%20River.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/03.%20Hypnotised.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/03.%20I%20Can't%20Tell%20You%20Why.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/04.%20Quicksand%20Jesus.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/05.%20New%20Kid%20In%20Town.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/06.%20And%20The%20Band%20Played%20On....mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/7.%20Youth%20Gone%20Wild.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/david%20lee%20roth%20-%20night%20life.mp3",
            "https://wqkwjohykqdjrihmlwut.supabase.co/storage/v1/object/public/Musica/Eddie%20Money%20-%20Two%20Tickets....mp3"
        ];

        let currentTrackIndex = 0;

        // Función para mezclar aleatoriamente el array (estilo radio)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let playlistRandom = shuffleArray([...playlistOriginal]);

        function loadTrack(index) {
            if (index >= playlistRandom.length) {
                playlistRandom = shuffleArray([...playlistOriginal]);
                currentTrackIndex = 0;
            }
            const trackUrl = playlistRandom[currentTrackIndex];
            audio.src = trackUrl;
            
            // Extraer nombre limpio del archivo para mostrar en pantalla
            const fileName = decodeURIComponent(trackUrl.split('/').pop().replace('.mp3', ''));
            trackInfo.textContent = "Transmitiendo: " + fileName;
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.textContent = "⏸ Pausar Transmisión";
                }).catch(e => console.log("Error al reproducir:", e));
            } else {
                audio.pause();
                playBtn.textContent = "▶ Reproducir Radio";
            }
        });

        audio.addEventListener('ended', () => {
            currentTrackIndex++;
            loadTrack(currentTrackIndex);
            audio.play();
        });

        // Inicializar reproductor
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>
